[project]
name = "vftk-images"
version = "0.1.0"
description = "Package generaor for images of VFTK"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "attrs>=26.1.0",
    "pytest>=9.1.1",
]

[project.scripts]
vftk-images = "vftk_images:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]